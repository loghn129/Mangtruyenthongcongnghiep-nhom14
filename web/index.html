<!doctype html>
<html lang="vi" class="bg-[#f6f7f5]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f7f5">
<title>Nhà kính thông minh</title>
<meta name="description" content="Giám sát SRD-THT-12R và điều khiển bơm, quạt thông gió qua Modbus RTU / RS-485.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffffff' stroke='%23e4e4e7'/%3E%3Cpath d='M9 22c0-7 5-12 14-12 0 9-5 14-12 14' fill='none' stroke='%23059669' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M9 24l8-8' stroke='%23059669' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { ink: '#f6f7f5', surface: '#ffffff' },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Consolas', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { background: #f6f7f5; }
  ::selection { background: rgba(16, 185, 129, .22); color: #064e3b; }

  /* Lưới chấm + quầng sáng phía trên, che dần bằng mặt nạ tròn */
  .bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(24, 24, 27, .09) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 35%, transparent 80%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 35%, transparent 80%); }
  .bg-glow { position: absolute; inset: 0 0 auto 0; height: 720px; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 50% 60% at 50% -10%, rgba(16, 185, 129, .14), transparent 70%); }

  /* Thẻ: vệt sáng đi theo con trỏ + nâng nhẹ khi rê chuột */
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(16, 185, 129, .07), transparent 45%);
    transition: opacity .3s; }
  .card:hover::before { opacity: 1; }
  .card { transition: border-color .3s, box-shadow .3s, transform .3s cubic-bezier(.2, .8, .2, 1); }
  .card { box-shadow: 0 1px 2px rgba(24, 24, 27, .04); }
  .card:hover { border-color: rgba(5, 150, 105, .3); box-shadow: 0 0 0 1px rgba(5, 150, 105, .06), 0 14px 36px -18px rgba(5, 150, 105, .35); }
  .card.lift:hover { transform: translateY(-3px); }

  /* Thanh trượt */
  .range { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 99px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, #059669 var(--p, 50%), #e4e4e7 var(--p, 50%)); }
  .range:disabled { cursor: not-allowed; opacity: .4; }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 2px solid #059669; box-shadow: 0 1px 6px rgba(5, 150, 105, .35); transition: transform .15s; }
  .range::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #059669; }
  .range:active::-webkit-slider-thumb { transform: scale(1.18); }
  .range:focus-visible { box-shadow: 0 0 0 3px rgba(5, 150, 105, .25); }

  /* Đường bus RS-485 khi có dữ liệu */
  .bus-live { background: linear-gradient(180deg, transparent, #10b981 45%, transparent 55%) 0 0 / 100% 240% #e4e4e7;
    animation: busflow 2.4s linear infinite; }
  @keyframes busflow { from { background-position: 0 100%; } to { background-position: 0 -140%; } }

  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(.6, 0, .2, 1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade-up { animation: fadeUp .7s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .drip { animation: drip 1.1s ease-in-out infinite; }
  @keyframes drip { 0%, 100% { transform: translateY(-1px); } 50% { transform: translateY(2px); } }
  .shimmer { background: linear-gradient(90deg, #e4e4e7 0%, #f4f4f5 50%, #e4e4e7 100%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* Mô hình nhà kính */
  .gh-spin, .gh-spin-slow { transform-box: view-box; transform-origin: 0 0; }   /* quay quanh gốc toạ độ cục bộ (tâm cánh quạt / mặt trời) */
  .gh-sway { transform-box: fill-box; }
  .gh-spin { animation: gh-rot .45s linear infinite; }
  .gh-spin-slow { animation: gh-rot 24s linear infinite; }
  .gh-sway { transform-origin: 50% 100%; animation: gh-sway 1.6s ease-in-out infinite alternate; }
  @keyframes gh-rot { to { transform: rotate(360deg); } }
  @keyframes gh-sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .gh-drop { animation: gh-drop 1.3s cubic-bezier(.4, 0, .7, 1) infinite; opacity: 0; }
  @keyframes gh-drop { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; }
    100% { transform: translate(var(--dx, 0), 150px); opacity: 0; } }
  .gh-mist { animation: gh-mist 2.4s ease-in-out infinite alternate; }
  @keyframes gh-mist { from { opacity: .45; } to { opacity: 1; } }
  .gh-flow { animation: gh-flow .6s linear infinite; }
  @keyframes gh-flow { to { stroke-dashoffset: -14; } }
  .gh-air { animation: gh-air .9s linear infinite; }
  @keyframes gh-air { from { stroke-dashoffset: 40; opacity: .9; } to { stroke-dashoffset: 0; opacity: .3; } }
  .gh-wave { animation: gh-wave 1s ease-in-out infinite alternate; }
  @keyframes gh-wave { to { transform: translateX(-6px); } }
  .gh-blink { animation: gh-blink 1s steps(2, start) infinite; }
  @keyframes gh-blink { to { opacity: .2; } }

  .scroll-thin { scrollbar-width: thin; scrollbar-color: #d4d4d8 transparent; }
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 8px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body class="min-h-screen bg-ink font-sans text-zinc-700 antialiased">
<div class="bg-grid" aria-hidden="true"></div>

<div id="root">
  <!-- Màn hình chờ khi thư viện đang tải; bị React thay thế sau khi khởi động -->
  <div style="min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#52525b">
    <div style="text-align:center;max-width:440px;padding:24px">
      <div id="boot-text" style="font:500 13px 'JetBrains Mono',Consolas,monospace;letter-spacing:.08em;color:#059669">ĐANG KHỞI ĐỘNG GIAO DIỆN…</div>
      <p id="boot-help" style="margin-top:12px;font-size:14px;line-height:1.6" hidden></p>
    </div>
  </div>
</div>

<script>
  // Nạp thư viện tuần tự, mỗi thư viện có 2 CDN dự phòng; sau đó biên dịch JSX bằng Babel ngay trong trình duyệt.
  (function () {
    var LIBS = [
      ['https://unpkg.com/react@18.3.1/umd/react.production.min.js',
       'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js'],
      ['https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
       'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js'],
      // Bản UMD của lucide-react đọc React từ biến toàn cục "react" (chữ thường)
      ['https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.min.js',
       'https://cdn.jsdelivr.net/npm/lucide-react@0.468.0/dist/umd/lucide-react.min.js'],
      ['https://unpkg.com/@babel/standalone@7.26.4/babel.min.js',
       'https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js'],
    ];
    var APP = ['/static/lib.js', '/static/ui.jsx', '/static/panels.jsx', '/static/admin.jsx', '/static/app.jsx'];

    function inject(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src; s.crossOrigin = 'anonymous';
        s.onload = resolve; s.onerror = function () { s.remove(); reject(new Error(src)); };
        document.head.appendChild(s);
      });
    }
    function loadAny(urls) {
      return urls.reduce(function (p, url) { return p.catch(function () { return inject(url); }); }, Promise.reject());
    }
    function fail(title, detail) {
      var t = document.getElementById('boot-text'), h = document.getElementById('boot-help');
      t.textContent = title; t.style.color = '#dc2626';
      h.hidden = false; h.textContent = detail;
    }

    LIBS.reduce(function (p, urls) {
      return p.then(function () { window.react = window.React; return loadAny(urls); });
    }, Promise.resolve()).then(function () {
      return APP.reduce(function (p, src) {
        return p.then(function () { return fetch(src, { cache: 'no-store' }); })
          .then(function (r) { if (!r.ok) throw new Error(src + ' (' + r.status + ')'); return r.text(); })
          .then(function (code) {
            var out = /\.jsx$/.test(src) ? Babel.transform(code, { presets: ['react'], filename: src }).code : code;
            var s = document.createElement('script');
            s.textContent = out + '\n//# sourceURL=' + src;
            document.body.appendChild(s);
          });
      }, Promise.resolve());
    }).catch(function (e) {
      console.error(e);
      fail('KHÔNG TẢI ĐƯỢC GIAO DIỆN',
        'Giao diện cần Internet để tải React, Tailwind và Lucide từ CDN (unpkg / jsDelivr). '
        + 'Chương trình Python vẫn chạy và vẫn tắt bơm, quạt an toàn khi thoát. Chi tiết: ' + e.message);
    });
  })();
</script>
</body>
</html>
